name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Verify customer registry and account isolation
        run: |
          npm install --prefix "$RUNNER_TEMP/cafe-qa" --no-save --package-lock=false @electric-sql/pglite@0.5.15
          PGLITE_MODULE="$RUNNER_TEMP/cafe-qa/node_modules/@electric-sql/pglite" node tools/qa/customer_registry.cjs
      - name: Build offline web release
        run: bash tools/build_web.sh
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: my-cloud-cafe-web
          path: build/web/
          if-no-files-found: error
