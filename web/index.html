<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Kelola kafe kecilmu. Sajikan kopi, tata ruangan, dan ikuti cerita pelanggan. Bisa dimainkan offline setelah unduhan awal.">
  <meta name="theme-color" content="#436c59">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Café">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>My Cloud Café</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f7f4ec;color:#263f36;font-family:system-ui,sans-serif}
    #loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px}
    #loading img{width:80px;height:80px;border-radius:22px;margin-bottom:22px}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:-.8px}p{color:#737d72;font-size:13px;line-height:1.7;max-width:310px}
    button{border:0;border-radius:10px;padding:12px 20px;background:#436c59;color:#fff;font:inherit;cursor:pointer}
    #offline-notice{position:fixed;z-index:999;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#263f36;color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;box-shadow:0 4px 20px #263f3620;max-width:calc(100% - 48px);text-align:center;pointer-events:none}
    [hidden]{display:none!important}
    @media(prefers-reduced-motion:no-preference){#loading img{animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-5px)}}}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <h1>My Cloud Café</h1>
    <p id="loading-status">Menyiapkan kafe…<br>Unduhan pertama memerlukan koneksi internet.</p>
    <button id="reload" hidden onclick="location.reload()">Muat ulang</button>
  </div>
  <div id="offline-notice" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">Aktifkan JavaScript untuk memainkan My Cloud Café.</p></noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.querySelector('#loading')?.remove();
      setTimeout(beginOfflineInstall, 750);
    });
    function beginOfflineInstall() {
    if ('serviceWorker' in navigator && window.isSecureContext) {
      const notice = document.querySelector('#offline-notice');
      let shown = false;
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type !== 'CAFE_OFFLINE_READY') return;
        document.documentElement.dataset.offlineReady = 'true';
        if (!shown) {
          shown = true;
          notice.textContent = 'Siap dimainkan offline';
          notice.hidden = false;
          setTimeout(() => { notice.hidden = true; }, 3500);
        }
      });
      navigator.serviceWorker.register('service-worker.js', {updateViaCache:'none'}).then(async registration => {
        const ready = await navigator.serviceWorker.ready;
        ready.active?.postMessage({type:'CAFE_CACHE_STATUS'});
        registration.update().catch(() => {});
      }).catch(() => {
        document.documentElement.dataset.offlineReady = 'false';
      });
    }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
