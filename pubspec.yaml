name: my_web_cafe
description: An offline café management game for web and mobile.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3
  supabase_flutter: 2.10.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: CafeSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: CafeEmoji
      fonts:
        - asset: assets/fonts/CafeEmoji.ttf
